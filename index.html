<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日文五十音學習遊戲 + 手寫辨識</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav>
    <button class="nav-btn" onclick="switchGame('table', this)">漢字表</button>
    <button class="nav-btn active" onclick="switchGame('quiz', this)">練習題</button>
    <button class="nav-btn" onclick="switchGame('match', this)">46清音消消樂</button>
    <button class="nav-btn" onclick="switchGame('flashcard', this)">記憶卡</button>
  </nav>

  <!-- KANJI TABLE -->
  <section id="table-game" class="game-section">
    <div class="table-container">
        <img src="./img/hiragana.jpg" alt="Hiragana Chart" class="table-img">
        <img src="./img/katakana.jpg" alt="Katakana Chart" class="table-img">
    </div>
  </section>

  <!-- GAME 1 -->
  <section id="quiz-game" class="game-section active">
    <div class="filter-panel">
      <div class="filter-row">
        <span class="filter-label">出題模式：</span>
        <button class="chip-btn active" onclick="toggleMode('random', this)">平假名 ⇄ 片假名 (隨機)</button>
        <button class="chip-btn" onclick="toggleMode('h2k', this)">平假名 ➔ 片假名</button>
        <button class="chip-btn" onclick="toggleMode('k2h', this)">片假名 ➔ 平假名</button>
      </div>
      <div class="filter-row">
        <span class="filter-label">母音：</span>
        <button class="chip-btn active" onclick="toggleVowel('all', this)">全部</button>
        <button class="chip-btn" onclick="toggleVowel('a', this)"> A </button>
        <button class="chip-btn" onclick="toggleVowel('i', this)"> I </button>
        <button class="chip-btn" onclick="toggleVowel('u', this)"> U </button>
        <button class="chip-btn" onclick="toggleVowel('e', this)"> E </button>
        <button class="chip-btn" onclick="toggleVowel('o', this)"> O </button>
      </div>
      <div class="filter-row">
        <span class="filter-label">主音：</span>
        <button class="chip-btn active" onclick="toggleConsonant('all', this)">全部</button>
        <button class="chip-btn" onclick="toggleConsonant('a', this)">a</button>
        <button class="chip-btn" onclick="toggleConsonant('k', this)">k</button>
        <button class="chip-btn" onclick="toggleConsonant('s', this)">s</button>
        <button class="chip-btn" onclick="toggleConsonant('t', this)">t</button>
        <button class="chip-btn" onclick="toggleConsonant('n', this)">n</button>
        <button class="chip-btn" onclick="toggleConsonant('h', this)">h</button>
        <button class="chip-btn" onclick="toggleConsonant('m', this)">m</button>
        <button class="chip-btn" onclick="toggleConsonant('y', this)">y</button>
        <button class="chip-btn" onclick="toggleConsonant('r', this)">r</button>
        <button class="chip-btn" onclick="toggleConsonant('w', this)">w</button>
      </div>
      <div class="filter-row">
        <span class="filter-label">答題方式：</span>
        <button class="chip-btn active" onclick="toggleAnswerType('choice', this)">選擇題</button>
        <button class="chip-btn" onclick="toggleAnswerType('handwriting', this)">手寫</button>
      </div>
      <div class="filter-row">
        <span class="filter-label">Romaji：</span>
        <button class="chip-btn active" onclick="toggleRomaji(true, this)">顯示</button>
        <button class="chip-btn" onclick="toggleRomaji(false, this)">不顯示</button>
      </div>
    </div>

    <div class="quiz-card">
      <div class="quiz-title" id="quiz-title">這個平假名的片假名是？</div>
      <div class="quiz-char" id="q-target">-</div>
      <div class="quiz-romaji" id="q-romaji">-</div>
      <div class="table-preview-container" id="q-table-preview">
        <img id="q-preview-img" src="./img/hiragana.jpg" class="table-preview-img" alt="Kana Table Preview">
        <div id="q-highlight" class="highlight-box"></div>
      </div>
      <div class="quiz-options" id="q-options"></div>

      <div class="quiz-writing-area" id="q-writing-area">
        <canvas id="quiz-canvas" width="220" height="220"></canvas>
        <div class="feedback-msg" id="quiz-feedback"></div>
        <div class="controls" style="margin-top:10px;">
          <button class="ctrl-btn secondary" onclick="clearQuizCanvas()">清除 (Clear)</button>
        </div>
      </div>
    </div>
  </section>

  <!-- GAME 2 -->
  <section id="match-game" class="game-section">
    <div class="match-layout">
      <div class="match-left">
        <div class="stats">
          <span>剩餘卡片: <span id="cards-left">92</span> / 92</span>
          <span>配對點擊: <span id="click-count">0</span> 次</span>
        </div>
        <div class="grid" id="match-grid"></div>
        <br>
        <button class="ctrl-btn" onclick="initMatchGame()">重新開始</button>
      </div>

      <div class="writing-pad-panel">
        <div class="pad-title">手寫辨識區 (Writing Pad)</div>
        <canvas id="canvas" width="240" height="240"></canvas>
        <div class="result-box">
          辨識結果：<span id="detected-char" class="result-char">-</span>
        </div>
        <div class="controls" style="margin-top:10px;">
          <button class="ctrl-btn secondary" onclick="clearCanvas()">清除 (Clear)</button>
        </div>
      </div>
    </div>
  </section>

  <!-- GAME 3 -->
  <section id="flashcard-game" class="game-section">
    <div class="flashcard-container" onclick="flipFlashcard()">
      <div class="flashcard" id="flashcard">
        <div class="card-face card-front">
          <span class="type-label">平假名</span>
          <span class="kana hiragana" id="fc-hiragana">あ</span>
          <span class="romaji" id="fc-romaji-front">a</span>
        </div>
        <div class="card-face card-back">
          <span class="type-label">片假名</span>
          <span class="kana katakana" id="fc-katakana">ア</span>
          <span class="romaji" id="fc-romaji-back">a</span>
        </div>
      </div>
    </div>
    <div class="controls">
      <button class="ctrl-btn" onclick="prevCard()">上一張</button>
      <button class="ctrl-btn" onclick="randomCard()">隨機</button>
      <button class="ctrl-btn" onclick="nextCard()">下一張</button>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
